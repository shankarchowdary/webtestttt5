<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>WebAR ArUco Hybrid</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
    #unity-container{position:fixed;inset:0;z-index:2;background:transparent!important;pointer-events:none}
    #unity-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;background:transparent!important;pointer-events:none}
    #loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-family:Arial,sans-serif;z-index:20;text-align:center;background:rgba(0,0,0,.65);padding:14px 18px;border-radius:10px}
    #progress{width:280px;height:8px;background:#333;border-radius:4px;overflow:hidden;margin-top:12px}
    #bar{width:0;height:100%;background:#fff}
  </style>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>Loading WebAR ArUco...</div><div id="progress"><div id="bar"></div></div></div>
</div>

<script>
  var Module = { onRuntimeInitialized: function(){ window.__opencvReady=true; console.log('[ArUco] OpenCV runtime ready'); } };
</script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>

<script>
  var canvas=document.querySelector('#unity-canvas');
  var loading=document.querySelector('#loading');
  var bar=document.querySelector('#bar');
  var buildUrl='Build';
  var config={
    dataUrl:buildUrl+'/webgl.data.unityweb',
    frameworkUrl:buildUrl+'/webgl.framework.js.unityweb',
    codeUrl:buildUrl+'/webgl.wasm.unityweb',
    streamingAssetsUrl:'StreamingAssets',
    companyName:'AR Demo',
    productName:'WebAR ArUco Hybrid',
    productVersion:'1.0',
    webglContextAttributes:{
      powerPreference:2,
      premultipliedAlpha:false,
      preserveDrawingBuffer:true
    }
  };
  var script=document.createElement('script');
  script.src=buildUrl+'/webgl.loader.js';
  script.onload=function(){
    createUnityInstance(canvas,config,function(p){bar.style.width=(100*p)+'%';})
      .then(function(){loading.style.display='none';})
      .catch(function(e){console.error('[ArUco] Unity error',e);loading.innerText='Unity error: '+e;});
  };
  document.body.appendChild(script);
</script>
</body>
</html>
